/etc/apache2/sites-available/bernaldev.com.conf

<VirtualHost *:80>
        ServerName bernaldev.com
        ServerAlias www.bernaldev.com
        Redirect permanent / https://bernaldev.com/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>

        ServerName bernaldev.com
	ServerAlias www.bernaldev.com
        ServerAdmin info@bernaldev.com
        DocumentRoot /var/www/bernaldev.com

        ErrorLog /var/www/bernaldev.com/logs/error.log
        CustomLog /var/www/bernaldev.com/logs/access.log combined

        SSLCertificateFile /etc/letsencrypt/live/bernaldev.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/bernaldev.com/privkey.pem
        Include /etc/letsencrypt/options-ssl-apache.conf

        Alias /cdn_media/ /var/www/bernaldev.com/cdn_media/
        Alias /cdn_static/ /var/www/bernaldev.com/cdn_static/

        <Directory /var/www/bernaldev.com/cdn_static>
             Require all granted
        </Directory>

        <Directory /var/www/bernaldev.com/cdn_media>
             Require all granted
        </Directory>

       WSGIDaemonProcess bernaldev.com python-home=/var/www/bernaldev.com/webenv python-path=/var/www/bernaldev.com/laestanciaazul
       WSGIProcessGroup bernaldev.com
       WSGIScriptAlias / /var/www/bernaldev.com/laestanciaazul/web/wsgi.py process-group=bernaldev.com

       <Directory /var/www/bernaldev/laestanciaazul/>
            <Files wsgi.py>
                  Require all granted
            </Files>
       </Directory>

</VirtualHost>
</IfModule>
